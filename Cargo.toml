[workspace]
resolver = "3"
members = [
    # 服务端和客户端共用：协议生成代码、对象模型
    "common/protocol",
    "common/object",
    "common/flight",
    # 服务端
    "server/obs",
    "server/store",
    "server/store-sql",
    "server/store-blob",
    "server/auth",
    "server/tree",
    "server/merge",
    "server/land",
    "server/query",
    "server/git",
    "server/cache",
    "server/api",
    "server/scion",
    # 客户端
    "client/sdk",
    "client/wc",
    "client/daemon",
    "client/gitimport",
    "client/cli",
    # 开发工具（依赖分层检查等）
    "xtask",
]

[workspace.package]
version = "0.1.11"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
scion-proto = { path = "common/protocol" }
scion-object = { path = "common/object" }
scion-flight = { path = "common/flight" }
scion-obs = { path = "server/obs" }
scion-store = { path = "server/store" }
scion-store-sql = { path = "server/store-sql" }
scion-store-blob = { path = "server/store-blob" }
scion-auth = { path = "server/auth" }
scion-tree = { path = "server/tree" }
scion-merge = { path = "server/merge" }
scion-land = { path = "server/land" }
scion-query = { path = "server/query" }
scion-git = { path = "server/git" }
scion-cache = { path = "server/cache" }
scion-api = { path = "server/api" }
scion-client = { path = "client/sdk" }
scion-wc = { path = "client/wc" }
scion-daemon = { path = "client/daemon" }
scion-gitimport = { path = "client/gitimport" }

anyhow = "1"
async-trait = "0.1"
blake3 = "1.8"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
hex = "0.4"
prost = "0.14"
proptest = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots", "tls-webpki-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-types = "0.14"
tonic-health = "0.14"
tower = { version = "0.5", default-features = false }
http = "1"
protox = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
cargo_metadata = "0.23"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "migrate", "macros"] }
tempfile = "3"
moka = { version = "0.12", features = ["sync"] }
object_store = { version = "0.14", default-features = false, features = ["aws", "fs"] }
diffy = "0.5"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
