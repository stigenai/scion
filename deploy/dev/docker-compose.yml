# 本地开发依赖：S3 兼容对象存储（SeaweedFS）与 PostgreSQL（Standard 档元数据库）。
#
#   docker compose -f deploy/dev/docker-compose.yml up -d
#
# Trying Scion out: the server as well, anonymous and with fixed development secrets (production: deploy/prd).
# The image is opencsghq/scion:latest; SCION_IMAGE=scion:dev runs one built from this checkout
# (docker build -t scion:dev .). Add --profile cache for the regional cache on 7090.
#   docker compose -f deploy/dev/docker-compose.yml --profile server up -d
#
# When Docker Hub is out of reach, use a registry mirror: REGISTRY=docker.m.daocloud.io docker compose ...
#
# 默认用 SeaweedFS：MinIO 开源版已归档、停止维护，官方不再提供社区版下载。
# Scion 只用 S3 核心子集，MinIO 同样支持，CI 中两者都测试。需要 MinIO 时（例如对齐 starhub 部署）：
#   docker compose -f deploy/dev/docker-compose.yml --profile minio up -d minio
# endpoint http://localhost:9000，access key scion / scion-dev-secret，bucket scion-objects。
name: scion-dev

services:
  s3:
    image: ${REGISTRY:-docker.io}/chrislusf/seaweedfs:4.48
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API：endpoint http://localhost:8333，access key scion / scion-dev-secret
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo 's3.bucket.list' | weed shell >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  s3-init:
    image: ${REGISTRY:-docker.io}/chrislusf/seaweedfs:4.48
    depends_on:
      s3:
        condition: service_healthy
    # 幂等：bucket 已存在时创建会报错，以最后确认 bucket 存在为准
    entrypoint:
      - /bin/sh
      - -c
      - >-
        echo 's3.bucket.create -name scion-objects' | weed shell -master=s3:9333;
        echo 's3.bucket.list' | weed shell -master=s3:9333 | grep -q scion-objects

  # starhub / CSGHub 部署使用的 MinIO 版本（bitnami 镜像，2023.12）
  minio:
    profiles: ["minio"]
    image: ${REGISTRY:-docker.io}/bitnamilegacy/minio:2023
    environment:
      MINIO_ROOT_USER: scion
      MINIO_ROOT_PASSWORD: scion-dev-secret
      MINIO_DEFAULT_BUCKETS: scion-objects
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/ready"]
      interval: 5s
      retries: 30

  postgres:
    image: ${REGISTRY:-docker.io}/library/postgres:16
    environment:
      POSTGRES_USER: scion
      POSTGRES_PASSWORD: scion-dev-secret
      POSTGRES_DB: scion
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scion"]
      interval: 5s
      retries: 20

  # Trials: docker compose -f deploy/dev/docker-compose.yml --profile server up -d
  scion:
    profiles: ["server"]
    image: ${SCION_IMAGE:-opencsghq/scion:latest}
    command: ["--log-format", "json", "server"]
    environment:
      SCION_LISTEN: 0.0.0.0:7080
      # Development only, like the secrets here: no authentication. Production runs deploy/prd, which
      # requires it (docs/guide/auth.md); the server refuses to serve the network without one or the other
      SCION_ALLOW_ANONYMOUS: "true"
      SCION_META: postgres://scion:scion-dev-secret@postgres:5432/scion
      SCION_BLOBS: s3://scion-objects
      SCION_S3_ENDPOINT: http://s3:8333
      SCION_S3_ACCESS_KEY_ID: scion
      SCION_S3_SECRET_ACCESS_KEY: scion-dev-secret
      SCION_METRICS_LISTEN: 0.0.0.0:9464
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    ports:
      - "7080:7080"   # gRPC
      - "9464:9464"   # /metrics
    healthcheck:
      test: ["CMD", "scn", "doctor", "--endpoint", "http://127.0.0.1:7080"]
      interval: 5s
      retries: 30

  # The regional cache: add --profile cache
  cache:
    profiles: ["cache"]
    image: ${SCION_IMAGE:-opencsghq/scion:latest}
    command: ["--log-format", "json", "cache"]
    environment:
      SCION_CACHE_LISTEN: 0.0.0.0:7090
      SCION_CACHE_UPSTREAMS: http://scion:7080
      SCION_CACHE_MEMORY: 512MiB
      SCION_METRICS_LISTEN: 0.0.0.0:9464
    depends_on:
      scion:
        condition: service_healthy
    ports:
      - "7090:7090"
      - "9465:9464"

volumes:
  s3-data:
  pg-data:
  minio-data:
