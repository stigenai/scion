[package]
name = "scion-cli"
description = "scn: the Scion command line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "scn"
path = "src/main.rs"

[dependencies]
clap.workspace = true
bytes.workspace = true
scion-client.workspace = true
scion-daemon.workspace = true
tonic.workspace = true
tower = { workspace = true, features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tracing-subscriber.workspace = true
scion-gitimport.workspace = true
scion-wc.workspace = true
scion-proto.workspace = true
serde.workspace = true
similar = "3"
regex = "1"
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
scion-api.workspace = true
scion-store.workspace = true
scion-auth = { workspace = true, features = ["testing"] }
