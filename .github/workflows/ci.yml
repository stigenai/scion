name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 在任意分支上手动运行：gh workflow run ci --ref <branch>
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # 依赖方向：客户端不得依赖服务端，服务端内部只能依赖下层
      - run: cargo xtask layers

  # Signed macOS builds of each commit on main, for machines that run main's scn (agents, the
  # test server): the keychain trusts a signed scn across versions, while each unsigned build is
  # a new program it asks about again. Uses the release environment's Apple secrets.
  signed-macos:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: signed-macos
      - run: cargo build --release --locked -p scion -p scion-cli
        env:
          SCION_SIGNED: "1"
      - name: Import the Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/ci-import-apple-certificate.sh
      - name: Sign
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || '3S93B6Z434' }}
        run: bash scripts/sign-macos.sh target/release/scion target/release/scn
      - run: target/release/scn --version && target/release/scion --version
      - name: Package
        run: |
          name="scion-main-${GITHUB_SHA::7}-aarch64-apple-darwin"
          mkdir -p "dist/$name" && cp target/release/scn target/release/scion "dist/$name/"
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: scion-main-aarch64-apple-darwin
          path: dist/*.tar.gz
          retention-days: 30

  # The installer is POSIX sh, run as `curl … | sh` on Linux and macOS
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -s sh install.sh
      - run: sh install.sh --help

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          # 已发布的 v1 协议不允许出现破坏性变更
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=${{ github.base_ref }}
          # 结果看 CI 日志即可；发 PR 评论需要额外的写权限
          pr_comment: false

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # golden 向量必须与构造逻辑一致（不允许手改 JSON）
      - run: git diff --exit-code testdata/

  # 真实存储后端（PostgreSQL、S3）的一致性测试；macOS runner 不支持服务容器，单独成 job
  test-backends:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scion
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scion" --health-interval 5s --health-timeout 5s --health-retries 20
      # MinIO：starhub / CSGHub 部署里使用的版本（bitnami 镜像，2023.12）
      minio:
        image: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsg_public/bitnami/minio:2023
        env:
          MINIO_ROOT_USER: scion
          MINIO_ROOT_PASSWORD: scion-dev-secret
          MINIO_DEFAULT_BUCKETS: scion-test
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/ready" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      SCION_TEST_PG_URL: postgres://scion:scion@localhost:5432/scion
      SCION_TEST_S3_ENDPOINT: http://localhost:8333
      SCION_TEST_S3_BUCKET: scion-test
      SCION_TEST_S3_ACCESS_KEY: scion
      SCION_TEST_S3_SECRET_KEY: scion-dev-secret
    steps:
      - uses: actions/checkout@v5
      # S3 兼容存储（SeaweedFS）；服务容器不支持自定义命令，所以在步骤里启动
      - name: Start S3 (SeaweedFS)
        run: |
          docker run -d --name s3 -p 8333:8333 -v "$PWD/deploy/dev/s3.json:/etc/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -s3 -s3.config=/etc/s3.json
          for i in $(seq 1 60); do
            docker exec s3 sh -c "echo 's3.bucket.create -name scion-test' | weed shell" 2>/dev/null \
              | grep -q "created bucket" && exit 0
            sleep 2
          done
          docker logs s3; exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 同一套对象存储测试分别跑在 SeaweedFS 与 MinIO 上，并校验识别出的服务种类
      - name: Store tests (PostgreSQL, SeaweedFS)
        run: cargo test -p scion-store-sql -p scion-store-blob -p scion
        env:
          SCION_TEST_S3_PROVIDER: seaweedfs
      - name: Object store tests on MinIO
        run: cargo test -p scion-store-blob -p scion
        env:
          SCION_TEST_S3_ENDPOINT: http://localhost:9000
          SCION_TEST_S3_PROVIDER: minio

  # 镜像与 docker compose 冒烟测试：起 PostgreSQL + SeaweedFS + scion server，建仓库、提交、合入、读回，查指标
  docker:
    runs-on: ubuntu-latest
    env:
      # The image built below instead of the published one
      SCION_IMAGE: scion:dev
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: scion:dev
          build-args: CARGO_PROFILE=dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose smoke test (production, authentication required)
        working-directory: deploy/prd
        run: |
          printf 'SCION_DB_PASSWORD=%s\nSCION_S3_SECRET=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > .env
          docker compose up -d --wait
          # Anonymous requests are refused (a bare `!` would not fail the step under bash -e)
          if docker compose exec -T scion scn --endpoint http://127.0.0.1:7080 repo create anonymous; then exit 1; fi
          token=$(docker compose exec -T scion scion admin token create --subject admin --group admins | sed -n 's/^token: //p')
          docker compose exec -T -e SCION_TOKEN="$token" scion sh -c 'scn --endpoint http://127.0.0.1:7080 repo create demo \
            && cd /data && scn --endpoint http://127.0.0.1:7080 clone demo \
            && cd demo && echo hello > a.txt && scn commit -m first && scn land && scn cat main:a.txt' | grep -x hello
          curl -fs localhost:9464/metrics | grep 'scion_land_batches_total{outcome="landed"} 1'
      - if: failure()
        working-directory: deploy/prd
        run: docker compose logs
      - name: Compose smoke test (development, anonymous)
        run: |
          (cd deploy/prd && docker compose down)
          compose="docker compose -f deploy/dev/docker-compose.yml --profile server"
          $compose up -d --wait
          $compose exec -T scion scn --endpoint http://127.0.0.1:7080 repo create demo
      - if: failure()
        run: docker compose -f deploy/dev/docker-compose.yml --profile server logs

  # 函数级测试要求（服务端设计文档 §12.1）
  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scion
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scion" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SCION_TEST_PG_URL: postgres://scion:scion@localhost:5432/scion
      SCION_TEST_S3_ENDPOINT: http://localhost:8333
      SCION_TEST_S3_BUCKET: scion-test
      SCION_TEST_S3_ACCESS_KEY: scion
      SCION_TEST_S3_SECRET_KEY: scion-dev-secret
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # 分支覆盖率需要 nightly
      # S3 兼容存储（SeaweedFS）；服务容器不支持自定义命令，所以在步骤里启动
      - name: Start S3 (SeaweedFS)
        run: |
          docker run -d --name s3 -p 8333:8333 -v "$PWD/deploy/dev/s3.json:/etc/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -s3 -s3.config=/etc/s3.json
          for i in $(seq 1 60); do
            docker exec s3 sh -c "echo 's3.bucket.create -name scion-test' | weed shell" 2>/dev/null \
              | grep -q "created bucket" && exit 0
            sleep 2
          done
          docker logs s3; exit 1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --branch --no-report
      - name: Core crates (lines >= 90%, branches >= 80%)
        run: |
          cargo llvm-cov report --package scion-object --package scion-store --package scion-store-sql --package scion-store-blob \
            --ignore-filename-regex '(xtask|testsuite)' --json --summary-only > core.json
          jq -e '.data[0].totals.lines.percent >= 90' core.json
          jq -e '(.data[0].totals.branches.count == 0) or (.data[0].totals.branches.percent >= 80)' core.json
      - name: Whole workspace (lines >= 80%)
        run: cargo llvm-cov report --ignore-filename-regex 'xtask' --fail-under-lines 80

  # PR 新增或修改的代码覆盖率 >= 90%。用 stable 且不收集分支信息：
  # nightly llvm-cov 导出带分支数据的 lcov 时会崩溃（LLVM 自身的 bug）
  diff-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scion
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scion" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SCION_TEST_PG_URL: postgres://scion:scion@localhost:5432/scion
      SCION_TEST_S3_ENDPOINT: http://localhost:8333
      SCION_TEST_S3_BUCKET: scion-test
      SCION_TEST_S3_ACCESS_KEY: scion
      SCION_TEST_S3_SECRET_KEY: scion-dev-secret
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # S3 兼容存储（SeaweedFS）；服务容器不支持自定义命令，所以在步骤里启动
      - name: Start S3 (SeaweedFS)
        run: |
          docker run -d --name s3 -p 8333:8333 -v "$PWD/deploy/dev/s3.json:/etc/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -s3 -s3.config=/etc/s3.json
          for i in $(seq 1 60); do
            docker exec s3 sh -c "echo 's3.bucket.create -name scion-test' | weed shell" 2>/dev/null \
              | grep -q "created bucket" && exit 0
            sleep 2
          done
          docker logs s3; exit 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --ignore-filename-regex 'xtask' --lcov --output-path lcov.info
      - run: pipx run diff-cover lcov.info --compare-branch=origin/${{ github.base_ref }} --fail-under=90
