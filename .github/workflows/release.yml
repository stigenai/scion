name: release

# Pushing a tag vX.Y.Z builds the server (`scion`) and the client (`scn`) for Linux and macOS and
# publishes them as a GitHub release, and pushes the server image (the version and latest). The tag
# must match the workspace version in Cargo.toml.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Release notes come from docs/releases/<tag>.md when it exists, else GitHub generates them.
# Rerun for an existing tag: gh workflow run release -f tag=v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to release, such as v0.1.0
        required: true

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: The tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG" || { echo "tag $TAG does not match version $version"; exit 1; }

  build:
    needs: check
    # The Apple signing secrets live in the release environment
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04, so the Linux binaries need glibc 2.35 or newer
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled on Apple silicon
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p scion -p scion-cli
        env:
          # The macOS builds are signed below: scn then keeps credentials in the keychain
          SCION_SIGNED: ${{ runner.os == 'macOS' && '1' || '' }}
      # macOS: sign with OpenCSG's Developer ID (the certificate csglite uses), so that macOS lets
      # scn and scion ask for local network access. Secrets: APPLE_CERTIFICATE (the .p12, base64)
      # and APPLE_CERTIFICATE_PASSWORD; variables APPLE_SIGNING_IDENTITY and APPLE_TEAM_ID optional
      - name: Import the Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD are not set; macOS binaries must be signed"
            exit 1
          fi
          bash scripts/ci-import-apple-certificate.sh
      - name: Sign the macOS binaries
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || '3S93B6Z434' }}
        run: bash scripts/sign-macos.sh target/${{ matrix.target }}/release/scion target/${{ matrix.target }}/release/scn
      - name: Check the binaries run
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        run: |
          target/${{ matrix.target }}/release/scion --version
          target/${{ matrix.target }}/release/scn --version
      - name: Package
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release
          for pkg in scion-server:scion scn:scn; do
            name="${pkg%%:*}-$TAG-${{ matrix.target }}"
            mkdir -p "dist/$name"
            cp "$bin/${pkg##*:}" LICENSE README.md "dist/$name/"
            COPYFILE_DISABLE=1 tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  # The server image for linux/amd64 and linux/arm64, tagged with the version and latest, on Docker
  # Hub and the Aliyun registry (for users in China). Secrets in the release environment:
  # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, REGISTRY_USERNAME and REGISTRY_PASSWORD (Aliyun)
  image:
    needs: check
    environment: release
    runs-on: ubuntu-latest
    env:
      IMAGES: opencsghq/scion opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/scion
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Tags
        id: tags
        run: |
          # latest moves only forward: rerunning an older tag leaves it alone
          newest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          tags=
          for image in $IMAGES; do
            tags="$tags,$image:${TAG#v}"
            if [ "$newest" = "$TAG" ]; then tags="$tags,$image:latest"; fi
          done
          tags=${tags#,}
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags"
      - name: Check the registry secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN REGISTRY_USERNAME REGISTRY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::$name is not set; the image cannot be pushed"
              exit 1
            fi
          done
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: opencsg-registry.cn-beijing.cr.aliyuncs.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,scope=release-image,mode=max

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS && cp ../install.sh .
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          if [ -f "docs/releases/$TAG.md" ]; then notes=(--notes-file "docs/releases/$TAG.md"); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --verify-tag "${notes[@]}"
          fi

  # The published release, installed the way users install it
  verify:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Install the client and the server as a service, and use them
        env:
          SCION_NO_DAEMON: "1"
        run: |
          sh install.sh --server --version "$TAG"
          scn --version
          scn repo create http://127.0.0.1:7080/mono
          cd "$RUNNER_TEMP" && scn clone http://127.0.0.1:7080/mono && cd mono
          echo hello > README.md
          scn commit -m readme --author "CI <ci@example.com>" && scn land && scn log
      - name: An address beyond loopback requires the printed token
        env:
          SCION_NO_DAEMON: "1"
        run: |
          out=$(sh install.sh --server --version "$TAG" --listen 0.0.0.0:7081)
          echo "$out"
          token=$(printf '%s\n' "$out" | sed -n 's/.*scn login [^ ]* --token //p')
          test -n "$token"
          export SCION_CREDENTIALS_FILE="$RUNNER_TEMP/creds.json"
          ! scn repo create http://127.0.0.1:7081/denied
          scn login http://127.0.0.1:7081 --token "$token"
          scn repo create http://127.0.0.1:7081/team
