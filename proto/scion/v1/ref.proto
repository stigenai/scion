syntax = "proto3";

package scion.v1;

import "scion/v1/write.proto";

// ref 查询与管理。ref 是唯一的可变状态，结果永远不缓存。
service RefService {
  rpc ResolveRef(ResolveRefRequest) returns (ResolveRefResponse);
  rpc ListRefs(ListRefsRequest) returns (ListRefsResponse);
  // 创建 ref（分支），指向仓库中已有的提交。ref 已存在时返回 REF_VERSION_MISMATCH。需要该 ref 的 land 权限。
  rpc CreateRef(CreateRefRequest) returns (CreateRefResponse);
  // 把 ref 直接指向某个提交（可以不是快进，相当于强制推送）。expected_version 为 0 时不检查版本。
  // 需要该 ref 的 land 权限。平时前进 ref 用 LandService.Land。
  rpc UpdateRef(UpdateRefRequest) returns (UpdateRefResponse);
  // 删除 ref。不能删除仓库的默认分支。expected_version 为 0 时不检查版本。需要该 ref 的 land 权限。
  rpc DeleteRef(DeleteRefRequest) returns (DeleteRefResponse);
  // 订阅 ref 变化（daemon / 区域缓存预取、CI 触发）。先发送当前状态（快照），之后每次 ref 前进发送新状态。
  // 只保证最终送达每个 ref 的最新状态：同一 ref 短时间内多次前进时，中间版本可能被合并掉。
  // 断开后带上已知版本（known_versions）重新订阅即可续上，不会漏掉变化。
  rpc WatchRefs(WatchRefsRequest) returns (stream WatchRefsResponse);
  // A ref's history (`scn reflog`): one entry per move, newest first, kept until the ref is deleted.
  // Needs read access to the repository.
  rpc ListRefLog(ListRefLogRequest) returns (ListRefLogResponse);
}

message ListRefLogRequest {
  string repo = 1;
  string ref = 2;
  // Entries below this version; 0 starts at the newest.
  uint64 before_version = 3;
  // Default 20, at most 1000.
  uint32 limit = 4;
}

message RefLogEntry {
  // The ref's version after the move (1 when it was created).
  uint64 version = 1;
  bytes changeset_id = 2;
  int64 updated_at_ms = 3;
  RefMove move = 4;
  // Who moved it: the subjects whose requests the move carried out (several when the server
  // landed their requests together), comma-separated; `anonymous` without authentication. Empty
  // for moves recorded before servers kept this, and for the server's own.
  string actor = 5;
}

// How a ref got to an entry from the one before.
enum RefMove {
  REF_MOVE_UNSPECIFIED = 0;
  // The ref was created (version 1).
  REF_MOVE_CREATED = 1;
  // It moved forward: the old commit is in the new one's history (lands, fast-forward updates).
  REF_MOVE_FAST_FORWARD = 2;
  // It moved anywhere else (a forced update, such as moving back).
  REF_MOVE_FORCED = 3;
}

message ListRefLogResponse {
  repeated RefLogEntry entries = 1;
  // For the next page: before_version to ask with; 0 when there are no more.
  uint64 next_before_version = 2;
}

message ResolveRefRequest {
  string repo = 1;
  string ref = 2;
}

message ResolveRefResponse {
  bytes changeset_id = 1;
  bytes root_tree = 2;
  uint64 version = 3;
}

message ListRefsRequest {
  string repo = 1;
}

message RefInfo {
  string name = 1;
  bytes changeset_id = 2;
  uint64 version = 3;
  // Set for an annotated tag.
  TagAnnotation annotation = 4;
}

// What an annotated tag says about the commit it names (git's tag object).
message TagAnnotation {
  string message = 1;
  // Who tagged and when. Left out in CreateRef: the caller, now.
  Signature tagger = 2;
  // The git tag object as it was pushed or imported (signed tags keep their signature, and their
  // git SHA); empty when the tag was made in Scion. Its `object` must be the target's git SHA.
  bytes git_object = 3;
}

message ListRefsResponse {
  // 按名字字节序。
  repeated RefInfo refs = 1;
}

message CreateRefRequest {
  string repo = 1;
  string ref = 2;
  bytes changeset_id = 3;
  // Makes it an annotated tag; only for tags (refs named tags/...).
  TagAnnotation annotation = 4;
}

message UpdateRefRequest {
  string repo = 1;
  string ref = 2;
  bytes changeset_id = 3;
  uint64 expected_version = 4;
}

message DeleteRefRequest {
  string repo = 1;
  string ref = 2;
  uint64 expected_version = 3;
}

message CreateRefResponse {
  RefInfo ref = 1;
}

message UpdateRefResponse {
  RefInfo ref = 1;
}

message DeleteRefResponse {}

message WatchRefsRequest {
  string repo = 1;
  // 要订阅的 ref 名；为空表示仓库中的全部 ref。
  repeated string refs = 2;
  // 客户端已知的版本：快照中只包含比它新的 ref。
  map<string, uint64> known_versions = 3;
}

message RefEvent {
  string name = 1;
  bytes changeset_id = 2;
  bytes root_tree = 3;
  uint64 version = 4;
}

message WatchRefsResponse {
  repeated RefEvent events = 1;
  // 快照发送完毕（第一条响应即为快照，即使其中没有事件）。之后的响应都是实时变化。
  bool snapshot = 2;
}
