syntax = "proto3";

package scion.v1;

import "scion/v1/common.proto";
import "scion/v1/write.proto";

// 不需要本地仓库的查询（「源码管理即 API」）。revision 为 ref 名或提交 id 的文本形式（c1…）。
// A revision may also be a 40-hex git SHA, and take git-style suffixes: REV~N, REV^, REV^N.
service QueryService {
  // 读取文件内容，分块流式返回；断开后用 offset 续传。
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileResponse);
  // 列出目录，path 为空表示根目录。
  rpc ListDir(ListDirRequest) returns (ListDirResponse);
  // 历史：从 revision 开始按代数从新到旧，覆盖所有父提交；可按路径过滤（相对第一个父提交）。
  rpc Log(LogRequest) returns (LogResponse);
  // ancestor 是否为 descendant 的祖先（含相等）。
  rpc IsAncestor(IsAncestorRequest) returns (IsAncestorResponse);
  // 最佳公共祖先（互不为祖先），按代数从高到低。
  rpc MergeBase(MergeBaseRequest) returns (MergeBaseResponse);
  // 两个版本之间的文件级差异，按路径排序分批流式返回。
  rpc Diff(DiffRequest) returns (stream DiffResponse);
  // The commit that last changed each line of a file. As in git, a line a merge brought from
  // another parent keeps that parent's blame; only lines no parent had go to the merge commit. A
  // renamed file keeps the blame it had under its old path.
  rpc Blame(BlameRequest) returns (BlameResponse);
  // 把 revision（ref 名、提交 id 文本或 40 位 git sha）解析为提交。
  rpc ResolveRevision(ResolveRevisionRequest) returns (ResolveRevisionResponse);
  // 单个路径的条目；path 为空时返回根目录。
  rpc Stat(StatRequest) returns (StatResponse);
  // 按种类读取派生数据（公开的结构化格式，不暴露内部存储格式）。
  rpc GetDerived(GetDerivedRequest) returns (GetDerivedResponse);
  // 批量把提交 id 映射为 git 兼容的提交 sha（第一次查询时计算并缓存）。
  rpc GetGitShas(GetGitShasRequest) returns (GetGitShasResponse);
  // 把一个版本（或其中的目录）打包成 tar.gz / zip / tar，分块流式返回。
  rpc Archive(ArchiveRequest) returns (stream ArchiveResponse);
  // 目录中每个条目最后一次被改动的提交（沿第一父提交链；合并提交照搬某个分支上的条目时，归到那个分支上的提交，与 git log -1 -- PATH 相同），按名字分页。
  rpc ListLastCommits(ListLastCommitsRequest) returns (ListLastCommitsResponse);
  // 目录（含全部子目录）下的文件数、子目录数与总字节数；path 为空表示整个仓库。
  rpc GetTreeStats(GetTreeStatsRequest) returns (GetTreeStatsResponse);
  // Lines of files at a revision that match a pattern (`scn grep`), in path order, streamed in
  // batches. Needs read access to the paths searched (the whole repository when none are given).
  rpc Grep(GrepRequest) returns (stream GrepResponse);
}

message ReadFileRequest {
  string repo = 1;
  string revision = 2;
  string path = 3;
  uint64 offset = 4;
}

message ReadFileResponse {
  bytes blob_id = 1;
  uint64 offset = 2;
  bytes data = 3;
  bool last = 4;
  uint64 total_size = 5;
  EntryMode mode = 6;
}

message ListDirRequest {
  string repo = 1;
  string revision = 2;
  string path = 3;
}

message ListDirResponse {
  // revision 解析得到的提交。
  bytes changeset_id = 1;
  bytes tree_id = 2;
  repeated TreeEntry entries = 3;
}

message LogRequest {
  string repo = 1;
  string revision = 2;
  // 只返回改动了该路径（文件或目录）的提交；为空表示不过滤。
  string path = 3;
  // 每页条数，默认 50，上限 1000。
  uint32 page_size = 4;
  // 上一页返回的 next_page_token；非空时忽略 revision。
  string page_token = 5;
  // Follow the file in `path` across renames and copies, like `git log --follow` (which lists no
  // merges). A page ends at the commit that renamed or copied it there, with `renamed_from` set;
  // ask for the next page with that path.
  bool follow = 6;
}

message LogEntry {
  bytes changeset_id = 1;
  repeated bytes parents = 2;
  Signature author = 3;
  Signature committer = 4;
  string message = 5;
  uint64 generation = 6;
  bytes root_tree = 7;
  map<string, bytes> extensions = 8;
}

message LogResponse {
  repeated LogEntry entries = 1;
  // 为空表示没有更多。按路径过滤时，一页可能少于 page_size 甚至为空，但仍可继续。
  string next_page_token = 2;
  // With `follow`: the path the file had before the page's last commit, which renamed it. Empty
  // when there was no rename, or the caller cannot read the old path (history stops there).
  string renamed_from = 3;
}

message IsAncestorRequest {
  string repo = 1;
  string ancestor = 2;
  string descendant = 3;
}

message IsAncestorResponse {
  bool is_ancestor = 1;
}

message MergeBaseRequest {
  string repo = 1;
  string a = 2;
  string b = 3;
}

message MergeBaseResponse {
  // 没有公共祖先时为空。
  repeated bytes bases = 1;
}

message DiffRequest {
  string repo = 1;
  // 为空表示空树（即列出 to 中的全部文件）。
  string from = 2;
  string to = 3;
  // 只比较该路径（文件或目录）；为空表示整个仓库。
  string path = 4;
}

// 一个文件的变化：没有 old 为新增，没有 new 为删除。
message FileDiff {
  string path = 1;
  TreeEntry old = 2;
  TreeEntry new = 3;
}

// 一批文件差异；各批按路径首尾相接。
message DiffResponse {
  repeated FileDiff files = 1;
}

message BlameRequest {
  string repo = 1;
  string revision = 2;
  string path = 3;
}

message BlameCommit {
  bytes changeset_id = 1;
  Signature author = 2;
  // 提交说明的第一行。
  string summary = 3;
}

// 连续若干行归属同一个提交。
message BlameRange {
  // 从 1 开始。
  uint32 start_line = 1;
  uint32 line_count = 2;
  // commits 中的下标。
  uint32 commit_index = 3;
}

message BlameResponse {
  bytes blob_id = 1;
  repeated BlameCommit commits = 2;
  // 按行号排序、首尾相接，覆盖文件的全部行。
  repeated BlameRange ranges = 3;
}

message ResolveRevisionRequest {
  string repo = 1;
  string revision = 2;
}

message ResolveRevisionResponse {
  bytes changeset_id = 1;
  bytes root_tree = 2;
  uint64 generation = 3;
  repeated bytes parents = 4;
}

message StatRequest {
  string repo = 1;
  string revision = 2;
  string path = 3;
}

message StatResponse {
  bytes changeset_id = 1;
  // 根目录时 name 为空、mode 为 TREE。
  TreeEntry entry = 2;
}

enum DerivedKind {
  DERIVED_KIND_UNSPECIFIED = 0;
  // 提交对应的 git sha：导入的提交为原始 sha，其余按 git 对象格式计算（见 docs/guide/git-sha.md）。
  DERIVED_KIND_GIT_SHA1 = 1;
  // 代数与第一父提交链深度。
  DERIVED_KIND_GENERATION = 2;
}

message GetDerivedRequest {
  string repo = 1;
  string revision = 2;
  DerivedKind kind = 3;
}

message Generation {
  uint64 generation = 1;
  // 0 表示未知（跳表建立之前写入的提交）。
  uint64 first_parent_depth = 2;
}

message GetDerivedResponse {
  bytes changeset_id = 1;
  // 该提交没有这种派生数据时不设置。
  oneof value {
    bytes git_sha1 = 2;
    Generation generation = 3;
  }
}

message GetGitShasRequest {
  string repo = 1;
  // 提交 id（二进制），最多 1000 个。
  repeated bytes changeset_ids = 2;
}

message GetGitShasResponse {
  // 与 changeset_ids 一一对应的 20 字节 sha。
  repeated bytes git_sha1 = 1;
}

enum ArchiveFormat {
  // 等同 TAR_GZ。
  ARCHIVE_FORMAT_UNSPECIFIED = 0;
  ARCHIVE_FORMAT_TAR_GZ = 1;
  ARCHIVE_FORMAT_ZIP = 2;
  ARCHIVE_FORMAT_TAR = 3;
}

message ArchiveRequest {
  string repo = 1;
  string revision = 2;
  ArchiveFormat format = 3;
  // 只打包这个目录（保留它在仓库中的路径）；空表示整个仓库。
  string path = 4;
  // 加在归档中每个路径前面，例如 "qwen-main/"；为空或以 "/" 结尾。
  string prefix = 5;
}

message ArchiveResponse {
  // 归档内容的下一段。
  bytes data = 1;
  // 只在第一条消息中设置：打包的提交。
  bytes changeset_id = 2;
}

message ListLastCommitsRequest {
  string repo = 1;
  string revision = 2;
  // 目录路径，空表示根目录。
  string path = 3;
  // 按名字排序后跳过的条目数。
  uint32 offset = 4;
  // 每页条目数，0 表示默认值 1000，最大 1000。
  uint32 limit = 5;
}

message LastCommit {
  // 条目名。
  string name = 1;
  // 最后改动它的提交；超过扫描上限仍未找到时为空。
  bytes changeset_id = 2;
}

message ListLastCommitsResponse {
  bytes changeset_id = 1;
  repeated LastCommit entries = 2;
  // entries 引用到的提交（去重，按代数从新到旧）。
  repeated LogEntry commits = 3;
  // 目录中（对调用方可见的）条目总数，用于分页。
  uint32 total = 4;
}

message GetTreeStatsRequest {
  string repo = 1;
  string revision = 2;
  string path = 3;
}

message GetTreeStatsResponse {
  bytes changeset_id = 1;
  bytes tree_id = 2;
  // 文件数（含可执行文件与符号链接）。
  uint64 files = 3;
  // 子目录数（不含自身）。
  uint64 directories = 4;
  // 文件字节数之和。
  uint64 bytes = 5;
}

message GrepRequest {
  string repo = 1;
  string revision = 2;
  // A regular expression (Rust regex syntax, close to git grep -E), or with fixed_strings a literal.
  string pattern = 3;
  bool fixed_strings = 4;
  bool ignore_case = 5;
  // Directories or files to search, in this order; empty: the whole tree.
  repeated string paths = 6;
  // Stop after this many matching lines: default 1000, at most 10000.
  uint32 max_matches = 7;
}

message GrepMatch {
  string path = 1;
  // 1-based.
  uint64 line_number = 2;
  // The line without its end, cut to 1000 bytes; not necessarily UTF-8.
  bytes line = 3;
}

message GrepResponse {
  bytes changeset_id = 1;
  repeated GrepMatch matches = 2;
  // Set on the last message: whether it stopped at max_matches, and how many files it searched
  // and left out (binary, larger than 1 MiB, redacted, links and submodules).
  bool truncated = 3;
  uint64 files_searched = 4;
  uint64 files_skipped = 5;
}
